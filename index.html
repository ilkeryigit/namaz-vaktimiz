<!doctype html>
<html lang="tr" data-theme="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namaz Vaktimiz</title>
  </head>
  <body>
    <main id="root">
      <header id="drag">
        <div class="head-l">
          <span id="place">—</span>
          <span id="date" class="dim">—</span>
        </div>
        <div id="clock" class="no-drag"></div>
      </header>

      <div class="corner">

          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="currentColor">

              fill-rule="evenodd"
              d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"
            />
          </svg>
        </button>
        <button id="settings-btn" class="corner-btn" type="button" aria-label="Ayarlar" title="Ayarlar">
          <!-- Google Material Design "settings" (Apache-2.0) -->
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
        </button>
      </div>

      <section id="nowbox">
        <div class="now-lbl">Şu anki vakit</div>
        <div id="now">—</div>
        <div id="next" class="dim">—</div>
      </section>

      <section id="times"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
