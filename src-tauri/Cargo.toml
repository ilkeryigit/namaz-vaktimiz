[package]
name = "namaz-vaktimiz"
version = "1.0.0"
description = "Masaüstü namaz vakti ve saat widget'ı"
authors = ["Namaz Vaktimiz"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "namaz_vaktimiz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
